name: Nix tag build + release

on:
  schedule:
    # Daily 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo whose latest tag to build'
        required: false
        default: '1jehuang/jcode'
      force:
        description: 'Rebuild even if this tag was already published (true/false)'
        required: false
        default: 'false'

concurrency:
  group: nix-tag-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-latest-tag:
    name: Build latest upstream tag via Nix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Optional: signing key for the GitHub Pages binary cache. When unset,
      # the cache steps are skipped and only the release tarball is published.
      NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
      # Enable nix-command/flakes for every nix invocation in this job (the
      # build step also passes them explicitly; this covers store/copy too).
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official installer script: the JS nix-installer-action breaks under the
      # runner's Node 24 (see jcode-nix.md).
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh --no-daemon --no-modify-profile
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      # Best-effort Nix store cache: a cache outage must never fail the build.
      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        continue-on-error: true

      # Resolve the highest vX.Y.Z tag upstream. `--refs` skips the peeled
      # ^{} entries and the regex drops non-version tags (weekly-*, etc.).
      - name: Resolve latest upstream tag
        id: tag
        env:
          UPSTREAM: ${{ inputs.upstream_repo || '1jehuang/jcode' }}
        run: |
          set -euo pipefail
          TAG="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)"
          if [[ -z "$TAG" ]]; then
            echo "No version tags found in ${UPSTREAM}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: ${TAG}"

      # Point the flake's jcode-src input at the tag we are about to build.
      # This matters: the flake builds a pinned input (not the fork's own
      # checkout), so the store path published to the binary cache below is
      # exactly what downstream `nix profile install github:grigio/jcode`
      # evaluates. When the pin is committed back to the default branch at the
      # end of this job, other Nix projects resolve to this prebuilt closure
      # instead of compiling from source. Runs unconditionally: re-locking is
      # cheap, and the gate below needs the freshly pinned rev to decide
      # whether the cache already covers this flake state.
      - name: Pin flake source to upstream tag
        env:
          UPSTREAM: ${{ inputs.upstream_repo || '1jehuang/jcode' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # Rewrite only the jcode-src input's url to github:<owner>/<repo>/<tag>.
          # Other inputs (nixpkgs, crane, ...) are left untouched.
          sed -i "/^[[:space:]]*jcode-src = {/,/^[[:space:]]*};/ s|url = \"github:[^\"]*\"|url = \"github:${UPSTREAM}/${TAG}\"|" flake.nix
          grep -A2 "jcode-src = {" flake.nix
          # Lock the input to the tag's commit. Only jcode-src changes in
          # flake.lock; the nixpkgs/crane/rust-overlay pins stay as they are.
          nix flake update jcode-src --extra-experimental-features 'nix-command flakes'

      # Idempotent gate: skip when this flake state is already built AND
      # published. A release named nix-<tag> in THIS repo (grigio/jcode) means
      # the tag was built before; the gh-pages cache records the jcode-src rev
      # that produced it (jcode-src-rev, written by the cache step below). When
      # the pin changes (new upstream tag, or flake rework like this one), the
      # revs differ and we rebuild + republish, so the cache can never drift
      # from the flake input. GH_REPO pins gh to this repo; GITHUB_TOKEN only
      # has write access here, never to the upstream repo being synced.
      - name: Skip if already built and cached
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          RELEASE="nix-${TAG}"
          PINNED_REV="$(jq -r '.nodes["jcode-src"].locked.rev' flake.lock)"
          CACHED_REV="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/jcode-src-rev" || true)"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            RELEASE_EXISTS=yes
          else
            RELEASE_EXISTS=no
          fi
          if [[ "$RELEASE_EXISTS" == "yes" ]] && [[ "$PINNED_REV" == "$CACHED_REV" ]]; then
            echo "Release ${RELEASE} exists and cache covers ${PINNED_REV}; skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building ${TAG} (release exists: ${RELEASE_EXISTS}, pinned=${PINNED_REV}, cached=${CACHED_REV:-none})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build jcode
        if: steps.check.outputs.skip == 'false' || inputs.force == 'true'
        run: nix build .#jcode --print-build-logs --extra-experimental-features 'nix-command flakes'

      - name: Verify and stage binary
        if: steps.check.outputs.skip == 'false' || inputs.force == 'true'
        run: |
          set -euo pipefail
          # Smoke test the built binary, then fail closed if its version does
          # not match the tag we resolved. Capture output in a variable (no
          # pipes, no SIGPIPE edge cases) and print it for the run log.
          VERSION_OUTPUT="$(./result/bin/jcode --no-update --no-selfdev version 2>&1)"
          printf '%s\n' "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -qF "${{ steps.tag.outputs.tag }}"
          test -x ./result/bin/jcode
          mkdir -p dist
          # Publish a stripped, gzip-compressed copy: symbol tables are ~40 MB
          # and are never needed at runtime. The flake's own `nix build` output
          # stays untouched. The tarball is mainly for inspection and for Nix
          # environments that share the CI store closure; everyone else should
          # install the flake (see README).
          cp result/bin/jcode dist/jcode-nix-linux-x86_64.bin
          # cp preserves the store's read-only 0555 mode; make the copy
          # writable so strip can rewrite it in place.
          chmod u+w dist/jcode-nix-linux-x86_64.bin
          strip dist/jcode-nix-linux-x86_64.bin
          # Smoke-test the stripped binary before shipping it.
          STRIPPED_VERSION="$(./dist/jcode-nix-linux-x86_64.bin --no-update --no-selfdev version 2>&1)"
          printf '%s\n' "$STRIPPED_VERSION"
          echo "$STRIPPED_VERSION" | grep -qF "${{ steps.tag.outputs.tag }}"
          tar czf dist/jcode-nix-linux-x86_64.tar.gz -C dist jcode-nix-linux-x86_64.bin
          # Generate and verify the checksum from inside dist/ so SHA256SUMS
          # lists bare filenames (matches the official release convention).
          (cd dist && sha256sum jcode-nix-linux-x86_64.tar.gz > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          ls -lh dist/

      # Idempotent: same-day rerun with force uploads over the existing asset.
      # GH_REPO pins gh to this repo so a release is never created against the
      # upstream 1jehuang/jcode (where GITHUB_TOKEN gets HTTP 403).
      - name: Publish release
        if: steps.check.outputs.skip == 'false' || inputs.force == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM: ${{ inputs.upstream_repo || '1jehuang/jcode' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          RELEASE="nix-${TAG}"
          ASSET="dist/jcode-nix-linux-x86_64.tar.gz"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" "$ASSET" dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE" "$ASSET" dist/SHA256SUMS \
              --title "Nix build of ${TAG} (from ${UPSTREAM})" \
              --notes "Automated Nix build of upstream tag ${TAG}.

          - jcode-nix-linux-x86_64.tar.gz: stripped, gzip-compressed binary
          - SHA256SUMS: sha256 checksum for the tarball

          Install on Nix/NixOS with the flake (recommended):
          nix profile install github:grigio/jcode
          " \
              --latest=false
          fi

      # Publish a signed Nix binary cache on GitHub Pages so
      # `nix profile install github:grigio/jcode` substitutes the prebuilt
      # closure instead of compiling. Skipped until the NIX_CACHE_PRIVATE_KEY
      # secret is configured (see README "Nix / NixOS" -> "Prebuilt binary
      # cache").
      - name: Sign and package Nix binary cache
        if: (steps.check.outputs.skip == 'false' || inputs.force == 'true') && env.NIX_CACHE_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$NIX_CACHE_PRIVATE_KEY" > "$KEY_FILE"
          STORE_PATH="$(readlink -f ./result)"
          # Sign every path in the closure so Nix trusts the cache.
          nix store sign --key-file "$KEY_FILE" --recursive "$STORE_PATH"
          # Copy the signed closure into a local file:// binary cache. Nix
          # writes <hash>.narinfo, nar/<hash>.nar.xz and nix-cache-info
          # automatically, which is exactly the layout GitHub Pages serves.
          nix copy --to "file://$PWD/cache" "$STORE_PATH"
          # Record the jcode-src rev this closure was built from. The
          # "Skip if already built and cached" gate compares its pinned rev
          # against this file to decide whether a rebuild is needed.
          jq -r '.nodes["jcode-src"].locked.rev' flake.lock > cache/jcode-src-rev
          # Minimal Nix/NixOS landing page for the Pages site. index.html is
          # ignored by the Nix binary cache protocol, so it can live next to
          # the cache files at the site root.
          cp nix-pages/index.html cache/index.html
          du -sh cache

      - name: Deploy Nix binary cache to GitHub Pages
        if: (steps.check.outputs.skip == 'false' || inputs.force == 'true') && env.NIX_CACHE_PRIVATE_KEY != ''
        # The release tarball is the primary artifact; a Pages misconfiguration
        # (e.g. Pages not enabled yet) must not fail the release.
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: cache
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      # Commit the refreshed flake pin (flake.nix url + flake.lock rev) back to
      # the default branch so downstream `github:grigio/jcode` inputs resolve to
      # the tag whose closure is now in the binary cache. Without this, the
      # flake input and the cache would drift again and installs would compile.
      # This workflow only runs on schedule/manual dispatch, so the push cannot
      # re-trigger it. The idempotency gate above keeps the release/cache in
      # sync: the pin commit is made only after the closure is published.
      - name: Commit flake pin to default branch
        if: steps.check.outputs.skip == 'false' || inputs.force == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if git diff --quiet -- flake.nix flake.lock; then
            echo "flake.nix / flake.lock already point at the built tag; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "chore(nix): pin flake source to ${{ steps.tag.outputs.tag }}"
          # Rebase onto the latest default branch before pushing so a concurrent
          # commit to the repo does not turn this into a non-fast-forward push.
          git fetch origin "${DEFAULT_BRANCH}"
          git rebase "origin/${DEFAULT_BRANCH}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${DEFAULT_BRANCH}"
          echo "Pushed flake pin for ${{ steps.tag.outputs.tag }} to ${DEFAULT_BRANCH}"
