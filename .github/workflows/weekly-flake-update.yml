name: Weekly flake update + release

on:
  schedule:
    # Every Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo to sync and build'
        required: false
        default: '1jehuang/jcode'

concurrency:
  group: weekly-flake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly:
    name: Build and publish weekly Nix release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official installer script: the JS nix-installer-action breaks under the
      # runner's Node 24 (see jcode-nix.md).
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh --no-daemon --no-modify-profile
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      # Best-effort Nix store cache: a cache outage must never block the
      # weekly release.
      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        continue-on-error: true

      # The weekly release tracks the latest 1jehuang/jcode code, not this
      # repo's default branch: build upstream master with this repo's flake
      # applied on top. `build` is a scratch branch; nothing here is pushed.
      - name: Sync upstream and apply flake
        env:
          UPSTREAM: ${{ inputs.upstream_repo || '1jehuang/jcode' }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream master --depth 1
          git checkout -b build FETCH_HEAD
          git checkout "${GITHUB_REF_NAME}" -- flake.nix flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nix): apply jcode flake onto upstream master"

      # Build from the committed flake.lock FIRST so the weekly release is
      # reproducible and never blocked by a bad nixpkgs-unstable/crane/rust
      # bump that week. Input refreshes land separately via the PR below.
      - name: Build jcode (locked inputs)
        run: nix build .#jcode --print-build-logs --extra-experimental-features 'nix-command flakes'

      - name: Verify and stage binary
        run: |
          ./result/bin/jcode --version
          test -x ./result/bin/jcode
          mkdir -p dist
          cp result/bin/jcode dist/jcode-nix-linux-x86_64

      # Idempotent publish: a same-day workflow_dispatch rerun uploads over the
      # existing asset instead of failing. `--latest=false --prerelease` keeps
      # real versioned releases as "Latest" on the repo page.
      - name: Publish weekly release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream_repo || '1jehuang/jcode' }}
        run: |
          TAG="weekly-$(date +%Y.%m.%d)"
          ASSET="dist/jcode-nix-linux-x86_64"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Weekly jcode build ($TAG)" \
              --notes "Automated weekly Nix build of ${UPSTREAM} synced from upstream." \
              --latest=false \
              --prerelease
          fi

      # Input refresh is best-effort and must not block the release above.
      # Return to this repo's default branch (which owns the flake), bump the
      # lock there, and open a normal flake.lock PR.
      - name: Update flake inputs
        continue-on-error: true
        run: |
          git checkout "${GITHUB_REF_NAME}"
          nix flake update --extra-experimental-features 'nix-command flakes'

      - name: Open flake.lock update PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged, skipping PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="ci/flake-update-$(date +%Y.%m.%d)"
          BASE="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add flake.lock
          git commit -m "chore(nix): weekly flake.lock update"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore(nix): weekly flake.lock update" \
            --body "Automated weekly \`nix flake update\` refresh of nixpkgs, crane, and rust-overlay inputs."
          echo "changed=true" >> "$GITHUB_OUTPUT"
