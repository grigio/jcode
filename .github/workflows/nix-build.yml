name: Nix Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build jcode via flake.nix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Use the official installer script directly instead of a JS action:
      # DeterminateSystems/nix-installer-action@v9 dies with "Invalid URL"
      # under the GitHub runner's Node 24.
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh --no-daemon --no-modify-profile
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build jcode
        run: nix build .#jcode --print-build-logs --extra-experimental-features 'nix-command flakes'

      - name: Verify binary
        run: |
          ./result/bin/jcode --version
          test -x ./result/bin/jcode

      - name: Stage binary
        run: |
          mkdir -p dist
          cp result/bin/jcode dist/jcode-linux-x86_64

      # upload-artifact@v7 runs on Node 24 (no Node 20 deprecation warning).
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: jcode-linux-x86_64
          path: dist/jcode-linux-x86_64
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="dist/jcode-linux-x86_64"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "jcode ${VERSION}" \
              --generate-notes
          fi
